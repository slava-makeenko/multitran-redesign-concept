name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Публикации не отменяют друг друга: дожидаемся текущей
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Каталоги с подчёркиванием (_next) не должны проходить через Jekyll
      - run: touch out/.nojekyll

      # Тесты идут по собранному сайту под тем же подпутём, что на Pages.
      # Упали тесты — job красный, публикации нет.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright and axe
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Lighthouse CI budgets
        run: npm run test:lighthouse
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            playwright-report/
            .lighthouseci/reports/
          retention-days: 14
          if-no-files-found: ignore

      # Pages на бесплатном тарифе доступен только публичным репозиториям:
      # пока репозиторий приватный, CI проверяет и собирает, но не публикует
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        with:
          path: out

  deploy:
    needs: check-and-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
